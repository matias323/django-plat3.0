<style>
    #invoiceForm .form-label {
        font-weight: 600;
        margin-bottom: 4px;
    }
    #invoiceForm .invoice-product-card .card-header {
        background: #f8f9fa;
    }
    #invoiceForm .money-field {
        text-align: right;
    }
    #invoiceForm .select2-container {
        width: 100% !important;
    }

    #invoiceForm .invoice-subclass-wrapper {
        position: relative;
    }

    #invoiceForm .invoice-subclass-wrapper .select2-container {
        width: 100% !important;
    }

    #invoiceForm .select2-container--open {
        z-index: 1065;
    }
</style>
{% if permission_denied %}
    <div class="modal-header">
        <h5 class="modal-title">Nueva factura</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
        <div class="alert alert-danger mb-0">No tiene permisos para crear facturas.</div>
    </div>
{% else %}
    <div class="modal-header">
        <h5 class="modal-title">Nueva factura</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <form id="invoiceForm" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="modal-body">
            <h5 class="mb-3">Datos de factura</h5>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">N° Factura</label>
                    <input type="number" name="invoice_number" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">RUT proveedor</label>
                    <input type="number" name="provider_rut" id="invoiceProviderRut" class="form-control" required>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">DV</label>
                    <input type="text" name="provider_dv" class="form-control" maxlength="2" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="provider_name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Giro</label>
                    <input type="text" name="business_activity" class="form-control" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Comuna</label>
                    <select name="commune_id" id="invoiceCommune" class="form-control" required></select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" name="address" class="form-control" required>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">Numeral</label>
                    <input type="text" name="address_number" class="form-control" maxlength="30" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Dpto./Oficina/etc.</label>
                    <input type="text" name="address_block" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="phone" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Valor</label>
                    <input type="text" name="net_amount" id="invoiceNetAmount" class="form-control money-field" readonly required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">IVA</label>
                    <input type="text" name="vat_amount" id="invoiceVatAmount" class="form-control money-field" readonly required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Fecha factura</label>
                    <input type="date" name="invoice_date" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Fecha pago</label>
                    <input type="date" name="payment_date" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Documentos factura</label>
                    <input type="file" name="invoice_documents" class="form-control" accept=".pdf,.jpg,.jpeg,.png,.webp" multiple required>
                    <small class="text-muted">
                        Puede adjuntar factura, orden de compra, guía de despacho u otros documentos.
                    </small>
                </div>
            </div>
            <hr>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Productos de la factura</h5>
            </div>
            <div id="invoiceProducts"></div>
            <div class="d-flex justify-content-end align-items-center mb-3">
                <button type="button" class="btn btn-primary btn-sm" id="btnAddInvoiceProduct">
                    <span class="fa fa-plus"></span>
                    Agregar producto
                </button>
            </div>
        </div>
        <div class="modal-footer">
            <button type="submit" class="btn btn-primary">
                <span class="fa fa-save"></span>
                Guardar factura
            </button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
    </form>
    <script>
        (function () {
            let productCounter = 0;
            const funds = [
            {% for fund in funds %}
                {
                    id: {{ fund.id }}, name: "{{ fund.name|escapejs }}"
                }
                {% if not forloop.last %}
                    ,
                {% endif %}
            {% endfor %}
            ];
            const urls = {
                provider: "{% url 'inventory:provider_lookup' %}",
                communes: "{% url 'inventory:search_communes' %}",
                subclasses: "{% url 'inventory:search_subclasses' %}",
                save: "{% url 'inventory:invoice_save' %}"
            };
            function digits(v) {
                return String(v || '').replace(/\D/g, '');
            }
            function number(v) {
                return parseInt(digits(v), 10) || 0;
            }
            function money(v) {
                return String(v || 0).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            }
            function formatInput(el) {
                $(el).val(money(digits($(el).val())));
            }
            function showMessage(title, message, icon = 'info') {
                if (window.Swal && typeof window.Swal.fire === 'function') {
                    return window.Swal.fire({
                        title: title,
                        text: message,
                        icon: icon
                    });
                }

                if (window.swal && typeof window.swal.fire === 'function') {
                    return window.swal.fire({
                        title: title,
                        text: message,
                        icon: icon
                    });
                }

                if (typeof window.swal === 'function') {
                    try {
                        return window.swal(title, message, icon);
                    } catch (e) {
                        console.warn('SweetAlert no compatible, usando alert().', e);
                    }
                }

                alert(message);
                return null;
            }

            function error(m) {
                showMessage('Error', m || 'No se pudo guardar.', 'error');
            }
            function fundOptions() {
                let h = '<option value="">Seleccione</option>';
                funds.forEach(f => h += `<option value="${f.id}">${f.name}</option>`);
                return h;
            }
            function recalculate() {
                let net = 0;
                $('.invoice-product-card').each(function () {
                    net += Math.max(number($(this).find('[name="product_stock[]"]').val()), 1) * number($(this).find('[name="product_initial_value[]"]').val());
                });
                $('#invoiceNetAmount').val(money(net));
                $('#invoiceVatAmount').val(money(Math.round(net * 0.19)));
            }
            function startSubclass($select) {
                const $wrapper = $select.closest('.invoice-subclass-wrapper');

                $select.select2({
                    dropdownParent: $wrapper,
                    width: '100%',
                    placeholder: 'Buscar subclase...',
                    allowClear: true,
                    minimumInputLength: 2,
                    ajax: {
                        url: urls.subclasses,
                        dataType: 'json',
                        delay: 300,
                        data: p => ({
                            q: p.term || ''
                        }),
                        processResults: d => d
                    }
                }).on('select2:select', function (e) {
                    const d = e.params.data || {
                    }, card = $(this).closest('.invoice-product-card');
                    card.find('.asset-class-text').val(d.asset_class || '');
                    card.find('.class-text').val(d.class || '');
                    card.find('.life-text').val(d.useful_life_years ? d.useful_life_years + ' años': '');
                }).on('select2:clear', function () {
                    const card = $(this).closest('.invoice-product-card');
                    card.find('.asset-class-text,.class-text,.life-text').val('');
                });
            }
            function addProduct() {
                productCounter++;
                const html = `
                <div class="card mb-3 invoice-product-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <strong>Producto #${productCounter}</strong>
                        <button type="button" class="btn btn-danger btn-sm btn-remove-invoice-product">
                            <span class="fa fa-trash"></span>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-7 mb-3">
                                <label class="form-label">Nombre producto</label>
                                <input type="text" name="product_name[]" class="form-control" required>
                            </div>
                            <div class="col-md-1 mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" name="product_stock[]" class="form-control" min="1" value="1" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Marca</label>
                                <input type="text" name="product_brand[]" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Modelo</label>
                                <input type="text" name="product_model[]" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Tamaño</label>
                                <select name="product_size[]" class="form-control">
                                    <option value="">Seleccione</option>
                                    <option>PEQUEÑO</option>
                                    <option>MEDIANO</option>
                                    <option>GRANDE</option>
                                    <option>EXTRA GRANDE</option>
                                    <option>NO APLICA</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Color</label>
                                <input type="text" name="product_color[]" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">N° BCU</label>
                                <input type="text" name="product_bcu[]" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">N° SAP</label>
                                <input type="text" name="product_sap[]" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">N° Serial</label>
                                <input type="text" name="product_serial[]" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Subclase</label>
                                <div class="invoice-subclass-wrapper">
                                    <select name="product_subclass[]"
                                            class="form-control product-subclass"
                                            required></select>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Clase activo</label>
                                <input class="form-control asset-class-text" readonly>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Clase</label>
                                <input class="form-control class-text" readonly>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Vida útil</label>
                                <input class="form-control life-text" readonly>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Fecha adquisición</label>
                                <input type="date" name="product_acquisition_date[]" class="form-control" value="${new Date().toISOString().slice(0,10)}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Comienzo uso</label>
                                <input type="date" name="product_use_start_date[]" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Fondo</label>
                                <select name="product_fund[]" class="form-control" required>${fundOptions()}</select>
                            </div>
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Valor inicial (s/IVA)</label>
                                <input type="text" name="product_initial_value[]" class="form-control money-field product-value" required>
                            </div>
                        </div>
                    </div>
                </div>
                `;
                $('#invoiceProducts').append(html);
                startSubclass($('#invoiceProducts .invoice-product-card').last().find('.product-subclass'));
                recalculate();
            }
            $('#invoiceCommune').select2({
                dropdownParent: $('#invoiceModal'),
                width: '100%',
                placeholder: 'Buscar comuna...',
                allowClear: true,
                minimumInputLength: 2,
                ajax: {
                    url: urls.communes,
                    dataType: 'json',
                    delay: 300,
                    data: p => ({
                        q: p.term || ''
                    }),
                    processResults: d => d
                }
            });
            $('#invoiceProviderRut').on('blur', function () {
                const rut = digits($(this).val());
                if (!rut) return;
                $.getJSON(urls.provider, {
                    rut: rut
                }, function (r) {
                    if (r.status !== 'success') {
                        error(r.message);
                        return;
                    }
                    const d = r.data;
                    if (!d) return;
                    $('[name="provider_dv"]').val(d.dv || '');
                    $('[name="provider_name"]').val(d.name || '');
                    $('[name="business_activity"]').val(d.business_activity || '');
                    $('[name="phone"]').val(d.phone || '');
                    $('[name="email"]').val(d.email || '');
                    $('[name="address"]').val(d.address || '');
                    $('[name="address_number"]').val(d.address_number || '');
                    $('[name="address_block"]').val(d.address_block || '');
                    if (d.commune_id) {
                        $('#invoiceCommune').append(new Option(d.commune || '', d.commune_id, true, true)).trigger('change');
                    }
                });
            });
            $('#btnAddInvoiceProduct').on('click', addProduct);
            $(document).off('click.invoice', '.btn-remove-invoice-product').on('click.invoice', '.btn-remove-invoice-product',
            function () {
                $(this).closest('.invoice-product-card').remove();
                recalculate();
            });
            $(document).off('input.invoice', '.product-value,[name="product_stock[]"]').on('input.invoice',
            '.product-value,[name="product_stock[]"]', function () {
                if ($(this).hasClass('product-value')) formatInput(this);
                recalculate();
            });
            $('#invoiceForm').off('submit.inventory').on('submit.inventory', function (e) {
                e.preventDefault();
                if (!$('.invoice-product-card').length) {
                    error('Debe agregar al menos un producto.');
                    return;
                }
                const data = new FormData(this), button = $(this).find('button[type="submit"]');
                button.prop('disabled', true);
                $.ajax({
                    url: urls.save,
                    type: 'POST',
                    data: data,
                    processData: false,
                    contentType: false,
                    dataType: 'json',
                    success: r => {
                        if (r.status === 'success') {
                            if (window.reloadInventoryProducts) {
                                window.reloadInventoryProducts();
                            }

                            if (window.reloadInventoryInvoices) {
                                window.reloadInventoryInvoices();
                            }

                            window.inventoryHideModal('invoiceModal');
                            showMessage('Correcto', r.message, 'success');
                        } else error(r.message);
                    },
                    error: x => error(x.responseJSON?.message || 'No se pudo guardar la factura.'),
                    complete: () => button.prop('disabled', false)
                });
            });
            addProduct();
        })();
    </script>
{% endif %}
