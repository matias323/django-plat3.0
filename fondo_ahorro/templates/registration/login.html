{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3 text-center">Ingresar</h1>

        {% if form.errors %}
          <div class="alert alert-danger">
            Revisa tu usuario y contraseña.
          </div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
          {% endif %}

          <div class="mb-3">
            <label for="id_username" class="form-label">Usuario</label>
            <input type="text" name="username" autofocus required class="form-control" id="id_username" placeholder="tu.usuario">
          </div>

          <div class="mb-3">
            <label for="id_password" class="form-label">Contraseña</label>
            <input type="password" name="password" required class="form-control" id="id_password" placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <p class="text-center small text-secondary mt-3 mb-0">
          ¿Olvidaste tu contraseña?
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
