<!-- importar css -->
{% load static %}
<link rel="stylesheet" href="{% static 'contabilidad/libro_diario/css/custom.css' %}">

<main class="container-fluid px-lg-4 py-4">

    <!-- =========================================================================
    TARJETAS KPI INFORMATIVAS
    ========================================================================= -->
    <section class="row g-3 mb-4" id="seccion-kpis">
        <!-- Total Asientos -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card card-kpi border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center p-3">
                    <div class="icon-circle bg-primary-subtle text-primary me-3 flex-shrink-0">
                        <i class="bi bi-journal-album fs-4"></i>
                    </div>
                    <div class="flex-grow-1">
                        <p class="text-muted text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.5px;">Total Asientos</p>
                        <h3 class="fw-bold mb-0 text-dark" id="kpi-total-asientos">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Total Movimientos / Líneas -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card card-kpi border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center p-3">
                    <div class="icon-circle bg-info-subtle text-info me-3 flex-shrink-0">
                        <i class="bi bi-list-check fs-4"></i>
                    </div>
                    <div class="flex-grow-1">
                        <p class="text-muted text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.5px;">Total Líneas / Movimientos</p>
                        <h3 class="fw-bold mb-0 text-dark" id="kpi-total-movimientos">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Total Débito (Debe) -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card card-kpi border-0 shadow-sm h-100 border-start border-4 border-success">
                <div class="card-body d-flex align-items-center p-3">
                    <div class="icon-circle bg-success-subtle text-success me-3 flex-shrink-0">
                        <i class="bi bi-arrow-down-left-circle fs-4"></i>
                    </div>
                    <div class="flex-grow-1">
                        <p class="text-muted text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.5px;">Suma Total Debe</p>
                        <h4 class="fw-bold mb-0 text-success cell-currency" id="kpi-total-debe">$0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Total Crédito (Haber) y Cuadre -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card card-kpi border-0 shadow-sm h-100 border-start border-4 border-primary">
                <div class="card-body d-flex align-items-center p-3">
                    <div class="icon-circle bg-primary-subtle text-primary me-3 flex-shrink-0">
                        <i class="bi bi-arrow-up-right-circle fs-4"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <p class="text-muted text-uppercase mb-0" style="font-size: 0.72rem; letter-spacing: 0.5px;">Suma Total Haber</p>
                        </div>
                        <h4 class="fw-bold mb-1 text-primary cell-currency" id="kpi-total-haber">$0</h4>
                        <div id="kpi-badge-cuadre">
                            <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-0">
                                <i class="bi bi-check-circle-fill me-1"></i> Cuadrado
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- =========================================================================
    PANEL DE FILTROS AVANZADOS
    ========================================================================= -->
    <section class="card filter-card mb-4">
        <div class="card-body p-3 p-lg-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-bold text-dark fs-6 d-flex align-items-center gap-2">
                    <i class="bi bi-funnel-fill text-primary"></i> Filtros de Consulta del Libro Diario
                </span>
                <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" id="btn-clear-filters">
                    <i class="bi bi-x-circle me-1"></i> Limpiar Filtros
                </button>
            </div>

            <div class="row g-3 align-items-end">
                <!-- Período -->
                <div class="col-12 col-sm-6 col-md-3 col-xl-2">
                    <label class="form-label text-muted small fw-semibold mb-1">Período Contable</label>
                    <select class="form-select form-select-sm" id="filter-periodo">
                        <option value="0">Todos los períodos</option>
                        {% for periodo in periodos %}
                            <option value="{{ periodo.id }}">{{ periodo.period_date }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Fechas Desde / Hasta -->
                <div class="col-lg-3 col-md-3 col-sm-6">
                    <label class="form-label mb-1">Rango de Fechas:</label>
                    <div class="input-group input-group-sm">
                        <input type="date" class="form-control px-1" id="filter-fecha-desde" title="Fecha inicial">
                        <span class="input-group-text p-1 text-muted"><i class="bi bi-dash"></i></span>
                        <input type="date" class="form-control px-1" id="filter-fecha-hasta" title="Fecha final">
                    </div>
                </div>

                <!-- Tipo Asiento -->
                <div class="col-12 col-sm-6 col-md-3 col-xl-2">
                    <label class="form-label text-muted small fw-semibold mb-1">Tipo de Asiento</label>
                    <select class="form-select form-select-sm" id="filter-tipo">
                        <option value="0">Todos los tipos</option>
                        {% for tipo in asientos_tipos %}
                            <option value="{{ tipo.id }}">{{ tipo.description }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Estado -->
                <div class="col-12 col-sm-6 col-md-3 col-xl-2">
                    <label class="form-label text-muted small fw-semibold mb-1">Estado</label>
                    <select class="form-select form-select-sm" id="filter-estado">
                        <option value="0" selected>Todos los estados</option>
                        {% for estado in asientos_estados %}
                            <option value="{{ estado.id }}">{{ estado.description }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- btn busqueda -->
                <div class="col-12 col-sm-6 col-md-9 col-xl-2">
                    <button class="btn btn-outline-primary btn-sm w-100" id="btn-buscar-libro-diario">
                        <i class="bi bi-search me-1"></i> Buscar
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- =========================================================================
    CONTENEDOR DE ASIENTOS CONTABLES DEL LIBRO DIARIO
    ========================================================================= -->
    <section id="contenedor-asientos-diario">
    </section>

</main>

{% block extra_js %}
<script src="{% static 'contabilidad/libro_diario/js/app.js' %}"></script>
<script>
</script>

{% endblock %}
