<!-- modal info del periodo contable -->
<div class="modal fade" id="modalInfoPeriodo" tabindex="-1" aria-labelledby="modalInfoPeriodoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalInfoPeriodoLabel">Información del período contable</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <!-- Período -->
                    <div class="col-md-6">
                        <label class="form-label text-muted">Período</label>
                        <div id="txtInfoPeriodo" class="form-control"></div>
                    </div>

                    <!-- Estado -->
                    <div class="col-md-6">
                        <label class="form-label text-muted">Estado</label>
                        <span class="form-control" id="txtInfoEstado"></span>
                    </div>

                    <div class="col-12">
                        <hr>
                    </div>

                    <!-- Fecha inicio -->
                    <div class="col-md-6">
                        <label class="form-label text-muted">Fecha inicio</label>
                        <div id="txtInfoFechaInicio" class="form-control"></div>
                    </div>

                    <!-- Fecha término -->
                    <div class="col-md-6">
                        <label class="form-label text-muted">Fecha término</label>
                        <div id="txtInfoFechaTermino" class="form-control"></div>
                    </div>

                    <!-- Fecha apertura -->
                    <div class="col-md-6">
                        <label class="form-label text-muted">Fecha apertura</label>
                        <div id="txtInfoFechaApertura" class="form-control"></div>
                    </div>

                    <!-- Fecha cierre -->
                    <div class="col-md-6">
                        <label class="form-label text-muted">Fecha cierre</label>
                        <div id="txtInfoFechaCierre" class="form-control"></div>
                    </div>

                    <div class="col-12">
                        <hr>
                    </div>

                    <!-- Usuario -->
                    <div class="col-md-6">
                        <label class="form-label text-muted">Creado por</label>
                        <div id="txtInfoUsuario" class="form-control"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
